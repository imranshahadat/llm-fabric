[project]
name = "project6-1"
version = "0.1.0"
description = "Project6 — Enterprise-Grade LLM & RAG Application (LLM integration layer)"
readme = "README.md"
authors = [{ name = "imranshahadat", email = "imranali.13imran@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "cryptography<45",
    "langchain-google-genai>=4.5.1",
    "mlflow>=3.18.0",
    "langchain-openai>=1.8.3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2", "openai>=1.50"]
anthropic = ["langchain-anthropic>=0.2", "anthropic>=0.40"]
gemini = ["langchain-google-genai>=2.0", "google-generativeai>=0.8"]
openrouter = ["langchain-openai>=0.2", "openai>=1.50"]
vercel_ai = ["langchain-openai>=0.2", "openai>=1.50"]
all = [
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-google-genai>=2.0",
    "openai>=1.50",
    "anthropic>=0.40",
    "google-generativeai>=0.8",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "pyright>=1.1.380"]

[project.scripts]
project6-1 = "project6_1:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "injection", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"injection/**" = ["S", "D"]
"examples/**" = ["S", "D"]

[tool.pyright]
include = ["src", "injection", "examples"]
exclude = ["**/__pycache__"]
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportMissingParameterType = "error"
reportUnknownMemberType = "warning"
reportMissingImports = "warning"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["injection/tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:project6_1.*"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
